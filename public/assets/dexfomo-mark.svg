<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="df-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#1E9EFF" />
      <stop offset="100%" stop-color="#0280F6" />
    </linearGradient>
    <linearGradient id="df-crystal-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#1E9EFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="df-glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0280F6" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="df-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1E9EFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>
    <filter id="df-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="60" cy="60" r="48" fill="url(#df-core-glow)" />

  <!-- Outer Rounded Shield / Hex Frame -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#0E1320" stroke="url(#df-border-grad)" stroke-width="2.5" />

  <!-- Inner Subtle Grid Accent -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="60" y1="20" x2="60" y2="100" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Central Prismatic DEX Geometry (Cross-chain telemetry crystal) -->
  <g filter="url(#df-bloom)">
    <!-- Top-Left Facet -->
    <polygon points="60 22 88 50 60 60" fill="url(#df-crystal-grad)" opacity="0.95" />
    <!-- Bottom-Right Facet -->
    <polygon points="60 98 32 70 60 60" fill="url(#df-crystal-grad)" opacity="0.85" />
    <!-- Top-Right Facet -->
    <polygon points="60 22 98 60 88 50" fill="#00F2FE" opacity="0.7" />
    <!-- Bottom-Left Facet -->
    <polygon points="60 98 22 60 32 70" fill="#0280F6" opacity="0.75" />
    <!-- Center Left Wing -->
    <polygon points="22 60 60 60 32 70" fill="#06B6D4" opacity="0.9" />
    <!-- Center Right Wing -->
    <polygon points="98 60 60 60 88 50" fill="#1E9EFF" opacity="0.9" />
    <!-- Focal Target Ring (Precision Market Lens) -->
    <circle cx="60" cy="60" r="16" fill="none" stroke="#00F2FE" stroke-width="2.5" />
    <!-- Inner Core Dot -->
    <circle cx="60" cy="60" r="4.5" fill="#FFFFFF" />
  </g>
</svg>
