<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="df-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#1E9EFF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="df-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0280F6" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Container (80x80 scaled down to 56x56) -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#0E1320" stroke="url(#df-mark-grad)" stroke-width="1.8" />
    <!-- Prismatic Emblem -->
    <polygon points="28 10 42 24 28 28" fill="#00F2FE" opacity="0.9" />
    <polygon points="28 46 14 32 28 28" fill="#1E9EFF" opacity="0.9" />
    <polygon points="28 10 46 28 42 24" fill="#06B6D4" opacity="0.75" />
    <polygon points="28 46 10 28 14 32" fill="#0280F6" opacity="0.75" />
    <circle cx="28" cy="28" r="8" fill="none" stroke="#00F2FE" stroke-width="1.8" />
    <circle cx="28" cy="28" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: DEXFOMO -->
  <text x="82" y="44" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="0.5">DEXFOMO</text>

  <!-- Subtitle Tagline -->
  <text x="83" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="600" letter-spacing="1.2">MARKET INTELLIGENCE</text>

  <!-- Badge Pill -->
  <g transform="translate(230, 28)">
    <rect x="0" y="0" width="46" height="18" rx="5" fill="#1E9EFF" fill-opacity="0.12" stroke="#1E9EFF" stroke-opacity="0.3" stroke-width="1" />
    <text x="23" y="12.5" fill="#50BDFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">ALPHA</text>
  </g>
</svg>
